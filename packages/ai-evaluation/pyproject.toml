[project]
name = "ai-evaluation"
version = "0.1.0"
description = "Reusable, model-agnostic evaluation for wardrobe VLM tasks: metrics, evaluators, reports."
readme = "README.md"
requires-python = ">=3.12"
# Keep runtime dependencies minimal: this package is installed in Colab, CI and
# evaluation jobs. It must never depend on services/* or on a specific model.
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "slow: takes more than a few seconds; excluded by `make test`",
  "integration: talks to a real dependency (another service, an emulator)",
  "gpu: needs a CUDA GPU; never runs in CI or `make test`",
  "model: downloads or loads real model weights; excluded by `make test`",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
