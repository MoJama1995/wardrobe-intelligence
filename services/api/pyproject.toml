[project]
name = "wardrobe-intelligence-api"
version = "0.1.0"
description = "Public HTTP API: validation, orchestration and persistence. No ML dependencies."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# An application, not a library: uv installs dependencies only, never the project itself.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "slow: takes more than a few seconds; excluded by `make test`",
  "integration: talks to a real dependency (another service, an emulator)",
  "gpu: needs a CUDA GPU; never runs in CI or `make test`",
  "model: downloads or loads real model weights; excluded by `make test`",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
